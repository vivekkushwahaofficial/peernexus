name: CI/CD Pipeline

on:
  push:
    branches: [ main, cloudinary ]
  pull_request:
    branches: [ main, cloudinary ]

jobs:
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          cd peernexus-backend
          chmod +x mvnw
          ./mvnw clean test

  frontend-ci:
    name: Frontend CI (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: peernexus-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd peernexus-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd peernexus-frontend
          npm run build
